version: 1
project:
  id: 7204695b-7485-4989-863c-16cf6e4db155
  title: Taller de Introducción a Machine Learning
  description: This description goes in the preface of the pdf output. 
  keywords: [Machine Learning, Python, Análisis de Datos, Entrenamiento]
  authors:
    - name: Iliomar Rodriguez Ramos
    - name: Juvenal Bassa
  license:
    content: CC-BY-4.0
  references:
    myst-guide: https://mystmd.org/guide
    jupyter: https://docs.jupyter.org/en/latest

 # date: 2026-02-18 # ${BUILD_DATE} 
  github: https://github.com/iliomar/ # Change this URL to your GitHub repository
  edit_url: 
  
  plugins:
    - https://github.com/TUD-JB-Templates/JB2_plugins/releases/download/experiment/experiment.mjs
    - https://github.com/jupyter-book/myst-plugins/releases/download/page-last-updated/page-last-updated.mjs
  
  # exports and downloads
  exports:
    - format: typst
      template: lapreprint-typst
      output: exports/book.pdf
      id: output-pdf

  # Jupyter Notebook configuration
  jupyter:
    binder:
      repo: https://github.com/executablebooks/thebe-binder-base

  toc:
    # Landing page
    - file: index.md

    # 1. Foundations
    - file: content/01_foundations/index.md
      children:
        - file: content/01_foundations/01_intro_deep_learning.md
        - file: content/01_foundations/02_features_and_labels.ipynb

    # 2. Neural Networks
    - file: content/02_neural_networks/index.md
      children:
        - file: content/02_neural_networks/01_artificial_neuron.ipynb
        - file: content/02_neural_networks/02_activation_functions.ipynb
        - file: content/02_neural_networks/03_network_architecture.ipynb

    # 3. Training Neural Networks
    - file: content/03_training/index.md
      children:
        - file: content/03_training/01_forward_pass.ipynb
        - file: content/03_training/02_loss_functions.ipynb
        - file: content/03_training/03_gradient_descent.ipynb
        - file: content/03_training/04_backpropagation.ipynb

    # 4. First Neural Network
    - file: content/04_first_network/index.md
      children:
        - file: content/04_first_network/01_first_neural_network.ipynb
        - file: content/04_first_network/02_training_loop.ipynb
        - file: content/04_first_network/03_model_evaluation.ipynb

    # 5. Deep Neural Networks
    - file: content/05_deep_neural_networks/index.md
      children:
        - file: content/05_deep_neural_networks/01_deep_neural_networks.ipynb
        - file: content/05_deep_neural_networks/02_overfitting_and_regularization.ipynb

    # 6. Convolutional Neural Networks
    - file: content/06_convolutional_neural_networks/index.md
      children:
        - file: content/06_convolutional_neural_networks/01_images_as_data.ipynb
        - file: content/06_convolutional_neural_networks/02_convolutions.ipynb
        - file: content/06_convolutional_neural_networks/03_cnn_architecture.ipynb
        - file: content/06_convolutional_neural_networks/04_training_cnn.ipynb

    # 7. Projects
    - file: content/07_projects/index.md
      children:
        - file: content/07_projects/project_1_iris_neural_network.ipynb
        - file: content/07_projects/project_2_fashion_mnist.ipynb
        - file: content/07_projects/project_3_cifar10_cnn.ipynb

    # Resources
    - file: content/resources.md

  abbreviations:
    JB2: Jupyter Book 2
    CI/CD: Continuous Integration/Continuous Deployment
    GHA: GitHub Actions
    GH: GitHub
    IDE: Integrated Development Environment
    VSC: Visual Studio Code
    CLI: commmand line interface

    
site:
  template: book-theme
  options:
    favicon: ./content/figures/ml_favicon_1.ico      # path to your favicon
    style: ./css/custom.css
    logo: ./content/figures/ML_logo.png          # path to your logo, shown top left at site
    folders: false
    hide_authors: true

  actions:
    - title: Feedback
      url: https://github.com/iliomar/ml_taller_2026
